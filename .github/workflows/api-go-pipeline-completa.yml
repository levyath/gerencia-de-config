name: API Go CI/CD Completa
run-name: Pipeline executada por ${{ github.actor }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # CI
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Build
        working-directory: APIs para exercícios/api-go
        run: |
          go mod download
          go build -v ./...

  tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Testes unitarios
        working-directory: APIs para exercícios/api-go
        run: go test -v -coverprofile=coverage.out ./...
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: APIs para exercícios/api-go/coverage.out

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: APIs para exercícios/api-go

  sonarqube:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: APIs para exercícios/api-go
      
      - name: SonarQube
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  sast:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      
      - name: Semgrep
        uses: returntocorp/semgrep-action@v1

  # Container
  docker-lint:
    runs-on: ubuntu-latest
    needs: [tests, lint]
    steps:
      - uses: actions/checkout@v5
      
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: APIs para exercícios/api-go/Dockerfile

  docker-build:
    runs-on: ubuntu-latest
    needs: docker-lint
    steps:
      - uses: actions/checkout@v5
      
      - name: Build imagem
        uses: docker/build-push-action@v6
        with:
          context: ./APIs para exercícios/api-go
          file: APIs para exercícios/api-go/Dockerfile
          push: false
          tags: ${{ secrets.DOCKERHUB_USER }}/api-go:latest
          load: true
      
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USER }}/api-go:latest
          format: 'table'

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v5
      
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PWD }}
      
      - name: Push imagem
        uses: docker/build-push-action@v6
        with:
          context: ./APIs para exercícios/api-go
          file: APIs para exercícios/api-go/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USER }}/api-go:latest

  # CD
  deploy-homolog:
    runs-on: ubuntu-latest
    needs: docker-push
    environment: homologacao
    steps:
      - name: Deploy Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_HOMOLOG }}

  dast:
    runs-on: ubuntu-latest
    needs: deploy-homolog
    steps:
      - name: OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://api-go-homolog.onrender.com'

  deploy-prod:
    runs-on: ubuntu-latest
    needs: dast
    environment: producao
    steps:
      - name: Deploy Producao
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
